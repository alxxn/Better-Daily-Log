name: Better Daily Log

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/wiiu-env/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          make

      - name: Upload WPS
        uses: actions/upload-artifact@v4
        with:
          name: Better-Daily-Log
          path: |
            **/*.wps
